<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pao — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p class="topbar">Ships across the Philippines · Prices in peso</p>
  <header class="header">
    <a class="logo" href="#shop" data-action="shop">
      <span class="logo-mark" aria-hidden="true">P</span>
      <span class="logo-word">Pao</span>
    </a>
    <nav class="nav" aria-label="Shop">
      <button type="button" data-action="filter" data-filter="all">All</button>
      <button type="button" data-action="filter" data-filter="apparel">Apparel</button>
      <button type="button" data-action="filter" data-filter="drinkware">Drinkware</button>
      <button type="button" data-action="filter" data-filter="home">Home</button>
    </nav>
    <button class="cart-button" type="button" data-action="cart" aria-label="Open cart">
      Cart
      <span class="cart-count" data-cart-count>0</span>
    </button>
  </header>
  <main id="main"></main>
  <footer class="footer">
    <span class="logo-word">Pao</span>
    <p>Sample storefront for physical goods.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
